# Fixed project name: the container and its data volume keep their names whatever folder this runs from.
name: rubicks-cube

services:
  cube:
    build: .
    image: rubiks-cube
    restart: unless-stopped
    ports:
      - "${CUBE_PORT:-8095}:3000"
    env_file: .env
    volumes:
      - cube-data:/data

volumes:
  cube-data:
